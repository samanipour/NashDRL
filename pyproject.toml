[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nash-drl"
version = "0.8.1"
description = "Nash-DRL research environment with reproducible mock-data generation and SUMO/TraCI simulation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Nash-DRL Research Team"}]
license = {text = "Research Use"}
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.3,<3",
    "PyYAML>=6.0,<7",
    "pydantic>=2.7,<3",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "tqdm>=4.66,<5",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "salabim>=26.0.8,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[project.scripts]
nash-drl-simulate = "nash_drl.cli:simulate"
nash-drl-train = "nash_drl.cli:train"
nash-drl-train-ppo = "ppo.cli:train"
ppo-train = "ppo.cli:train"
ppo-evaluate = "ppo.cli:evaluate"
nash-drl-evaluate = "nash_drl.cli:evaluate"
nash-drl-infer = "nash_drl.cli:infer"
nash-drl-visualize = "nash_drl.cli:visualize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
