training:
  mode: mock
  episodes: 20
  gamma: 0.99
  actor_lr: 0.0003
  critic_lr: 0.0003
  exploration_sigma: 0.10
  target_update_interval: 100
  device: cpu
  seed: 42
  output_dir: outputs/training
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 5

