ppo:
  mode: mock
  episodes: 300
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.20
  value_coef: 0.50
  entropy_coef: 0.00
  ppo_epochs: 10
  minibatch_size: 16
  normalize_advantage: false
  max_grad_norm: 0.50
  reward_scale: 0.01
  device: cpu
  seed: 2027
  output_dir: outputs/ppo_training
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 25

ppo_network:
  hidden_dim: 64
  deep_set_dim: 64
  hidden_layers: 2
  deep_set_hidden_layers: 2
  initial_log_std: -0.5
  min_log_std: -5.0
  max_log_std: 1.0

# Common dataset/environment/reward sections remain identical to NashDRL.
