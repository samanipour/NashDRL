project:
  seed: 123

training:
  mode: mock
  episodes: 20
  gamma: 0.99
  actor_lr: 0.0003
  critic_lr: 0.0003
  exploration_sigma: 0.10
  exploration_sigma_final: 0.02
  exploration_decay_episodes: 1000
  reward_scale: 0.01
  max_grad_norm: 5.0
  replay_enabled: true
  replay_capacity: 10000
  replay_batch_size: 32
  replay_warmup: 32
  updates_per_step: 1
  target_update_interval: 100
  device: cpu
  seed: 123
  output_dir: outputs/training_large
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 5

ppo:
  mode: mock
  episodes: 20
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.20
  value_coef: 0.50
  entropy_coef: 0.00
  ppo_epochs: 10
  minibatch_size: 16
  normalize_advantage: false
  max_grad_norm: 0.50
  reward_scale: 0.01
  device: cpu
  seed: 123
  output_dir: outputs/ppo_training_large
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 5

ppo_network:
  hidden_dim: 64
  deep_set_dim: 64
  hidden_layers: 2
  deep_set_hidden_layers: 2
  initial_log_std: -0.5
  min_log_std: -5.0
  max_log_std: 1.0

evaluation:
  episodes: 5
  output_dir: outputs/test_large
  visualization: false

environment:
  energy_rate_kwh_per_km: 1.0
  charging_overhead: 6.0
  charging_fixed_cost: 1.0
  charging_floor_price: 0.0
  congestion_alpha: 0.15
  congestion_beta: 4.0
  use_model_travel_time: true

reward:
  travel_time_weight: 1.0
  charging_cost_weight: 1.0
  budget_penalty: 1000.0

simulation:
  mode: mock
  visualization: false
  sumo:
    binary: auto
    step_length_s: 1.0
    end_time_s: 600
    teleport_time_s: 120
    seed: 123
    default_edge_speed_kmh: 50.0
    vehicle_departure_gap_s: 2.0
    allow_turnarounds: true

mock_data:
  seed: 123
  num_vehicles: 50
  min_trips_per_vehicle: 1
  max_trips_per_vehicle: 4
  graph_nodes: 40
  graph_extra_edges: 55
  road_min_length_km: 0.5
  road_max_length_km: 10.0
  road_length_std_km: 2.0
  capacity_min_vph: 15
  capacity_max_vph: 150
  capacity_std_vph: 25.0
  speed_min_kmh: 25.0
  speed_max_kmh: 80.0
  speed_std_kmh: 12.0
  budget_min: 50.0
  budget_max: 500.0
  budget_std: 70.0
  budget_feasibility_multiplier: 1.20
  budget_resample_limit: 100
  trip_count_std: 1.0
