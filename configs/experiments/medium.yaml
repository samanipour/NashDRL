project:
  seed: 2027
training:
  mode: mock
  episodes: 300
  gamma: 0.97
  actor_lr: 0.0001
  critic_lr: 0.0003
  exploration_sigma: 0.25
  exploration_sigma_final: 0.03
  exploration_decay_episodes: 220
  reward_scale: 0.01
  max_grad_norm: 5.0
  replay_enabled: false
  replay_capacity: 10000
  replay_batch_size: 32
  replay_warmup: 32
  updates_per_step: 2
  target_update_interval: 50
  device: cpu
  seed: 2027
  output_dir: outputs/training_medium
  visualization: false
  save_checkpoints: true
  budget_constraints_enabled: true
  constraint_repair_passes: 2
  checkpoint_interval: 25
ppo:
  mode: mock
  episodes: 300
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  ppo_epochs: 10
  minibatch_size: 8
  normalize_advantage: false
  max_grad_norm: 0.5
  reward_scale: 0.01
  device: cpu
  seed: 2027
  output_dir: outputs/ppo_training_medium
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 25
network:
  hidden_dim: 32
  deep_set_dim: 64
  actor_hidden_layers: 4
  critic_hidden_layers: 4
  deep_set_hidden_layers: 2
  interaction_coupling_ratio: 0.9
ppo_network:
  hidden_dim: 64
  deep_set_dim: 64
  hidden_layers: 2
  deep_set_hidden_layers: 2
  initial_log_std: -0.5
  min_log_std: -5.0
  max_log_std: 1.0
evaluation:
  episodes: 10
  output_dir: outputs/test_medium
  visualization: false
  reward_profile: common
environment:
  energy_rate_kwh_per_km: 1.0
  charging_overhead: 6.0
  charging_fixed_cost: 1.0
  charging_floor_price: 0.0
  congestion_alpha: 0.15
  congestion_beta: 4.0
  use_model_travel_time: true
p_sweep:
  values: [0, 2, 5, 10, 15, 20, 30]
  episodes: 100
  mode: mock

reward:
  common:
    travel_time_weight: 1.0
    charging_cost_weight: 1.0
    budget_penalty: 100.0
  nash_drl:
    travel_time_weight: 1.0
    charging_cost_weight: 1.0
    budget_penalty: 500.0
  ppo:
    travel_time_weight: 1.0
    charging_cost_weight: 1.0
    budget_penalty: 10.0
  notes:
    common: Common evaluation reward; use for algorithm-neutral reporting.
    nash_drl: Constraint-dominant learning reward; large P makes hard-budget violations
      strongly unattractive.
    ppo: Sacrifice-permitting learning reward. P=10 is intentionally below the regular-loss
      scale of a meaningful subset of costly routes, so PPO can improve aggregate
      reward by accepting additional hard-budget violations when the system-level
      trade-off is favorable.
    condition: For a violating route to be individually preferred over its regular
      reward, P must be smaller than w_T*T + w_C*C. System-level dominance additionally
      depends on the aggregate trade-off across affected vehicles.
simulation:
  mode: mock
  visualization: false
  sumo:
    binary: auto
    step_length_s: 1.0
    end_time_s: 300
    teleport_time_s: 120
    seed: 2027
    default_edge_speed_kmh: 50.0
    vehicle_departure_gap_s: 1.0
    allow_turnarounds: true
mock_data:
  seed: 2027
  num_vehicles: 20
  min_trips_per_vehicle: 1
  max_trips_per_vehicle: 3
  graph_nodes: 14
  graph_extra_edges: 14
  road_min_length_km: 1.0
  road_max_length_km: 6.0
  road_length_std_km: 1.0
  capacity_min_vph: 20
  capacity_max_vph: 100
  capacity_std_vph: 15.0
  speed_min_kmh: 35.0
  speed_max_kmh: 70.0
  speed_std_kmh: 8.0
  budget_min: 15.0
  budget_max: 250.0
  budget_std: 4.0
  budget_feasibility_multiplier: 1.0
  budget_resample_limit: 200
  trip_count_std: 0.7
