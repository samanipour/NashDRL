project:
  name: nash-drl
  seed: 42

simulation:
  mode: mock                       # mock | real
  visualization: false
  generate_analytic_report: true
  output_dir: outputs/demo
  dataset_path: datasets/generated/mock_seed_42/dataset.json
  backend: traci
  sumo:
    binary: auto                   # auto | sumo | sumo-gui | absolute path
    step_length_s: 1.0
    end_time_s: 300
    teleport_time_s: 120
    seed: 42
    default_edge_speed_kmh: 50.0
    vehicle_departure_gap_s: 2.0
    allow_turnarounds: true
  salabim:
    enabled: true
    replay_speed: 1.0

mock_data:
  seed: 42
  num_vehicles: 12
  min_trips_per_vehicle: 1
  max_trips_per_vehicle: 3
  graph_nodes: 12
  graph_extra_edges: 10
  road_min_length_km: 1.0
  road_max_length_km: 8.0
  road_length_std_km: 1.5
  capacity_min_vph: 20
  capacity_max_vph: 80
  capacity_std_vph: 15.0
  speed_min_kmh: 30.0
  speed_max_kmh: 70.0
  speed_std_kmh: 10.0
  budget_min: 75.0
  budget_max: 300.0
  budget_std: 45.0
  budget_feasibility_multiplier: 1.20
  budget_resample_limit: 100
  trip_count_std: 0.9
  energy_rate_kwh_per_km: 1.0
  charging_overhead: 6.0
  charging_fixed_cost: 1.0
  charging_floor_price: 0.0
  congestion_alpha: 0.15
  congestion_beta: 4.0
  vehicle_departure_gap_s: 2.0

network:
  hidden_dim: 32
  deep_set_dim: 64
  actor_hidden_layers: 4
  critic_hidden_layers: 4

environment:
  energy_rate_kwh_per_km: 1.0
  charging_overhead: 6.0
  charging_fixed_cost: 1.0
  charging_floor_price: 0.0
  congestion_alpha: 0.15
  congestion_beta: 4.0
  max_steps: 300
  use_model_travel_time: true

reward:
  travel_time_weight: 1.0
  charging_cost_weight: 1.0
  budget_penalty: 100.0

training:
  mode: mock
  episodes: 20
  gamma: 0.99
  actor_lr: 0.0003
  critic_lr: 0.0003
  exploration_sigma: 0.1
  exploration_sigma_final: 0.02
  exploration_decay_episodes: 1000
  reward_scale: 0.01
  max_grad_norm: 5.0
  replay_enabled: true
  replay_capacity: 10000
  replay_batch_size: 32
  replay_warmup: 32
  updates_per_step: 1
  target_update_interval: 100
  device: cpu
  seed: 42
  output_dir: outputs/training
  visualization: false
  save_checkpoints: true
  checkpoint_interval: 5

evaluation:
  mode: mock
  episodes: 5
  output_dir: outputs/evaluation
  visualization: false
